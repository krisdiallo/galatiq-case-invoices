[project]
name = "galatiq-case-invoices"
version = "0.1.0"
description = "Local invoice processing automation prototype"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pillow>=11,<14",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "textual>=1,<9",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8,<3",
    "pytest>=8,<10",
    "reportlab>=4,<5",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
