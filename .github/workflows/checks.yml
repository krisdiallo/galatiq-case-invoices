name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check invoices scripts tests main.py
      - run: uv run ruff format --check invoices scripts tests main.py
      - run: uv run pytest -q
